<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="낙지도 로고">
  <title>낙지도</title>
  <!-- 낙지도 마크 — 발자국(낙상) + 지도 핀 + 낙지 다리 + 궤도.
       원본 그림.png(61×60)을 그대로 확대하면 뭉개져 벡터로 다시 그렸다.
       배경색·비율은 원본에서 측정한 값. 마크 경로는 logo-maskable.svg,
       components/ui/LogoMark.tsx 와 동일하게 유지할 것. -->
  <rect width="512" height="512" rx="104" fill="#0765C5"/>
  <g fill="#fff" transform="translate(256 256) scale(0.95) translate(-268 -256)">
    <!-- 궤도 — 기울어진 타원 고리. 핀 뒤를 지나므로 먼저 그리고,
         앞쪽(아래) 반원만 핀 위에 한 번 더 얹어 관통해 보이게 한다. -->
    <ellipse cx="256" cy="392" rx="107" ry="35" transform="rotate(-14 256 392)"
             fill="none" stroke="#fff" stroke-width="14"/>
    <!-- 발가락 5개 -->
    <ellipse cx="171" cy="99"  rx="33" ry="43" transform="rotate(-10 171 99)"/>
    <ellipse cx="242" cy="79"  rx="22" ry="29" transform="rotate(-4 242 79)"/>
    <ellipse cx="299" cy="90"  rx="20" ry="26" transform="rotate(8 299 90)"/>
    <ellipse cx="345" cy="113" rx="18" ry="24" transform="rotate(20 345 113)"/>
    <ellipse cx="378" cy="145" rx="16" ry="20" transform="rotate(32 378 145)"/>
    <!-- 지도 핀 — 가운데 구멍은 evenodd로 뚫는다 -->
    <path fill-rule="evenodd" d="
      M255 398 C255 398 332 288 332 208 A77 77 0 1 0 178 208 C178 288 255 398 255 398 Z
      M255 156 a44 44 0 1 0 0 88 a44 44 0 1 0 0-88 Z"/>
    <!-- 낙지 다리 — 바깥으로 뻗었다가 안쪽으로 단단히 말린다 -->
    <path fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"
          d="M210 292 C176 290 156 304 158 322 C160 337 180 340 184 327
             C186 318 177 314 172 320"/>
    <path fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"
          d="M300 292 C334 290 354 304 352 322 C350 337 330 340 326 327
             C324 318 333 314 338 320"/>
    <!-- 궤도 앞쪽 반원 — 핀 끝을 가로지른다 -->
    <path fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"
          transform="rotate(-14 256 392)"
          d="M149 392 A107 35 0 0 0 363 392"/>
  </g>
  <!-- 눈 두 개 (배경색으로 파냄) -->
  <g fill="#0765C5" transform="translate(256 256) scale(0.95) translate(-268 -256)">
    <circle cx="237" cy="286" r="9.5"/>
    <circle cx="273" cy="286" r="9.5"/>
  </g>
</svg>
